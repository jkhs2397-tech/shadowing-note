name: 30분 퀴즈 알림

on:
  schedule:
    # cron은 UTC 기준입니다. 한국시간 09:00~23:30 = UTC 00:00~14:30
    - cron: "*/30 0-14 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동으로 즉시 한 번 보내 볼 수 있습니다.

permissions:
  contents: read

jobs:
  push-quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: sentences.json 검사
        run: python3 scripts/validate.py

      - name: 퀴즈 알림 보내기
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 scripts/quiz_push.py
